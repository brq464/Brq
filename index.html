
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empire</title><link rel="stylesheet" href="style.css"></head><body>
  <link rel="stylesheet" href="style.css">
<div class="login" id="login"><h1>EMPIRE ONLINE</h1><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور"><button onclick="reg()">إنشاء حساب</button><button onclick="log()">تسجيل دخول</button><p id="e"></p></div>
<div id="game" style="display:none">
<header><h1>Empire World</h1><div>المتصلين <span id="o">0</span></div></header>
<div class="cards"><div class="card"><h3>الكاش</h3><p id="m"></p></div><div class="card"><h3>البنك</h3><p id="b"></p></div><div class="card"><h3>القرض</h3><p id="l"></p></div></div>
<div class="actions"><button onclick="salary()">استلام راتب</button><button onclick="loan()">أخذ قرض</button></div>
<div class="chat"><div id="msgs"></div><input id="msg"><button onclick="send()">إرسال</button></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const s=io();let me=''
function reg(){me=u.value;s.emit('register',{username:u.value,password:p.value})}
function log(){me=u.value;s.emit('login',{username:u.value,password:p.value})}
s.on('err',x=>e.innerText=x)
s.on('ok',u=>{login.style.display='none';game.style.display='block';upd(u)})
function upd(u){m.innerText=u.money+' SAR';b.innerText=u.bank+' SAR';l.innerText=u.loan+' SAR'}
s.on('online',x=>o.innerText=x)
s.on('upd',d=>{if(d.username===me)upd(d.user)})
function salary(){s.emit('salary')}
function loan(){s.emit('loan')}
function send(){s.emit('chat',msg.value);msg.value=''}
s.on('chat',d=>{msgs.innerHTML+='<div class="message"><b>'+d.user+'</b> '+d.time+'<br>'+d.msg+'</div>'})
</script></body></html>
